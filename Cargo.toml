[package]
name = "xcoc"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]
members = [".", "crates/mobile-ffi"]
resolver = "3"

[dependencies]
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "d3e9b8db84e4ead70ec0bf8a596dbad697f7db24", version = "=1.0.1" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "~1.53.2", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "d3e9b8db84e4ead70ec0bf8a596dbad697f7db24", version = "=1.0.1" }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
serde_json = "1"
sha2 = "0.11"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
