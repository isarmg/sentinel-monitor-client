[package]
name = "xcoc-mobile-ffi"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
jni-host-tests = ["dep:jni", "xcsc/jni"]

[dependencies]
xcoc = { path = "../.." }
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "c45e48e93e360542c2e1db6c6441a9e29b344b03", version = "=1.0.0", features = ["mobile-ffi"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "~1.53.2", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
jni = { version = "=0.22.4", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "c45e48e93e360542c2e1db6c6441a9e29b344b03", version = "=1.0.0", features = ["jni", "mobile-ffi"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
