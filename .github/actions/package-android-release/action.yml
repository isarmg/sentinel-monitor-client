name: Package Android Release
description: Build and verify explicitly unsigned arm64 APK and AAB release inputs.
runs:
  using: composite
  steps:
    - name: Verify mobile release version identity
      shell: bash
      run: python3 packaging/mobile/release.py check
    - name: Test and build Android Release
      shell: bash
      run: gradle -p clients/android testReleaseUnitTest assembleRelease bundleRelease lintRelease
    - name: Verify and package unsigned Android outputs
      shell: bash
      run: python3 packaging/mobile/release.py android --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"
    - name: Retain Android Release inputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: xcoc-android-arm64-v8a
        path: |
          dist/xcoc-android-arm64-v8a-unsigned.apk
          dist/xcoc-android-arm64-v8a-unsigned.aab
          dist/xcoc-android-release.json
        if-no-files-found: error
